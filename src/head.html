<title>Café Ruelle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Café Ruelle, Ottawa coffee roasters. From the summit to your cup: order ahead, this season's beans, come visit.">
<meta property="og:title" content="Café Ruelle">
<meta property="og:image" content="media/cup-logo.png">
<link rel="icon" href="media/logo-brown.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Warm roaster's shop: chocolate, mustard and steamed-milk cream. Heavy condensed caps in two tones,
   pill buttons with a round arrow, torn-paper seams between sections, rounded tiles.
   One committed warm look in every theme, so every colour is set explicitly. */
:root{
  --choc:#4A2A1D;        /* hero brown */
  --choc-deep:#2C1911;   /* footer, drawer */
  --ink:#3B2217;         /* headings and text on light */
  --ink-2:#6E5243;       /* secondary text, 5.9:1 on cream */
  --mustard:#F5B301;
  --mustard-2:#FFC734;
  --cream:#FBF5EC;
  --tile:#F3EADD;
  --line:#E5D8C6;
  --white:#FFFFFF;
  --on-dark:#FBF1E2;
  --on-dark-2:#D9C6B2;
  --display:"Barlow Condensed", "Arial Narrow", "Helvetica Neue Condensed", Impact, sans-serif;
  --body:"Barlow", "Helvetica Neue", Arial, system-ui, sans-serif;
  --step--1:clamp(.82rem,.8rem + .1vw,.88rem);
  --step-0:clamp(1rem,.97rem + .15vw,1.08rem);
  --step-1:clamp(1.15rem,1.05rem + .5vw,1.4rem);
  --step-2:clamp(2rem,1.5rem + 2.2vw,3.2rem);
  --step-3:clamp(2.7rem,1.8rem + 4.2vw,5.4rem);
  --step-4:clamp(3.4rem,2rem + 6.4vw,7.6rem);
  --gutter-l:max(20px, env(safe-area-inset-left, 0px));
  --gutter-r:max(20px, env(safe-area-inset-right, 0px));
  --stage-h:100vh;
  --tear-a:__TEAR_A__;
  --tear-b:__TEAR_B__;
  color-scheme:light;
}
@supports (height:100svh){ :root{ --stage-h:100svh } }
*{ box-sizing:border-box }
html{ scroll-behavior:smooth }
@media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto } }
body{ margin:0; background:var(--cream); color:var(--ink); font-family:var(--body); font-size:var(--step-0); line-height:1.55; -webkit-font-smoothing:antialiased; overflow-x:clip }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:30; background:var(--choc) }
h1,h2,h3{ font-family:var(--display); font-weight:800; text-transform:uppercase; line-height:.9; letter-spacing:.005em; text-wrap:balance; margin:0 }
p{ margin:0 }
a{ color:inherit }
button, input, select{ font:inherit; color:inherit }
img{ display:block; max-width:100% }
:focus-visible{ outline:3px solid var(--mustard); outline-offset:3px }
.wrap{ padding-left:var(--gutter-l); padding-right:var(--gutter-r); max-width:1320px; margin-inline:auto; width:100% }
.eyebrow{ display:inline-flex; align-items:center; gap:14px; font-weight:600; font-size:var(--step--1); letter-spacing:.02em }
.eyebrow::after{ content:""; width:56px; height:1.5px; background:currentColor; opacity:.7 }
.hl{ color:var(--mustard) }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }

/* ---------- Buttons: pill + round arrow ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 24px; border-radius:999px; border:0; font-weight:700; font-size:.98rem; text-decoration:none; white-space:nowrap; cursor:pointer; transition:background .2s ease, color .2s ease, transform .15s ease }
.btn:active{ transform:scale(.97) }
.btn-cream{ background:var(--white); color:var(--ink) }
.btn-cream:hover{ background:var(--mustard) }
.btn-choc{ background:var(--choc); color:var(--on-dark) }
.btn-choc:hover{ background:var(--ink); color:var(--mustard) }
.btn-mustard{ background:var(--mustard); color:var(--ink) }
.btn-mustard:hover{ background:var(--mustard-2) }
.btn-line{ background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink) }
.btn-line:hover{ background:var(--ink); color:var(--on-dark) }
.cta{ display:inline-flex; align-items:center; gap:4px; text-decoration:none; color:inherit }
.cta .arrow{ width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:var(--white); color:var(--ink); transition:transform .25s ease, background .2s ease }
.cta.dark .arrow{ background:var(--choc); color:var(--on-dark) }
.cta.line .arrow{ background:transparent; color:currentColor; box-shadow:inset 0 0 0 1.5px currentColor }
.cta:hover .arrow{ transform:rotate(45deg); background:var(--mustard); color:var(--ink); box-shadow:none }
.cta:hover .btn-cream{ background:var(--mustard) }
.cta:hover .btn-choc{ background:var(--ink); color:var(--mustard) }
.arrow svg{ width:17px; height:17px }
.play{ display:inline-flex; align-items:center; gap:12px; background:none; border:0; color:inherit; font-weight:600; cursor:pointer; padding:0; min-height:48px }
.play span{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.18); transition:background .2s ease }
.play:hover span{ background:var(--mustard); color:var(--ink) }
.play svg{ width:14px; height:14px; margin-left:2px }

/* ---------- Header ---------- */
.site-header{ position:fixed; top:env(safe-area-inset-top, 0px); left:0; right:0; z-index:20; color:var(--on-dark); transition:background .3s ease, padding .3s ease }
.site-header.solid{ background:rgba(74,42,29,.96); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px) }
.bar{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding-block:16px }
.site-header.solid .bar{ padding-block:10px }
.nav{ display:flex; gap:28px; font-weight:500; font-size:.96rem }
.nav a{ text-decoration:none; opacity:.9 }
.nav a:hover{ opacity:1; color:var(--mustard) }
.brand img{ height:46px; width:auto; transition:height .3s ease }
.site-header.solid .brand img{ height:38px }
.bar-right{ display:flex; align-items:center; gap:10px; justify-self:end }
.status{ display:inline-flex; align-items:center; gap:8px; font-size:.82rem; font-weight:500; margin-right:6px; white-space:nowrap; opacity:.92 }
.status::before{ content:""; width:8px; height:8px; border-radius:50%; background:#A89282 }
.status.open::before{ background:#8EE0A4; box-shadow:0 0 0 4px rgba(142,224,164,.25) }
.cart-btn{ position:relative; width:46px; height:46px; border-radius:50%; border:0; background:rgba(255,255,255,.16); color:var(--on-dark); display:grid; place-items:center; cursor:pointer }
.cart-btn:hover{ background:var(--mustard); color:var(--ink) }
.cart-btn svg{ width:20px; height:20px }
.badge{ position:absolute; top:-2px; right:-2px; min-width:20px; height:20px; border-radius:999px; background:var(--mustard); color:var(--ink); font:800 .72rem/20px var(--body); text-align:center; padding:0 5px }
.site-header .btn{ min-height:44px; padding:0 20px }
.site-header .cta .arrow{ width:44px; height:44px }
@media (max-width:980px){ .nav{ display:none } .bar{ grid-template-columns:auto 1fr } .brand{ order:-1 } }
@media (max-width:560px){ .status, .site-header .cta .arrow{ display:none } .brand img{ height:38px } }

/* ---------- 01 Hero: the Kling video, scrubbed by scroll ---------- */
.journey{ position:relative; background:var(--choc) }
.stage{ position:relative; height:var(--stage-h); min-height:580px; overflow:hidden; background:var(--choc); color:var(--on-dark) }
.stage .media{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:100% 50% }
.stage video{ opacity:0; transition:opacity .5s ease }
.stage.ready video{ opacity:1 }
#plate{ opacity:0 }
.shade{ position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(90deg, rgba(44,25,17,.86) 0%, rgba(58,32,22,.62) 34%, rgba(58,32,22,0) 62%),
             linear-gradient(180deg, rgba(44,25,17,.55) 0%, rgba(44,25,17,0) 24%) }
.hero-copy{ position:absolute; z-index:3; left:0; right:0; top:50%; transform:translateY(-46%) }
.hero-copy .inner{ max-width:660px; display:grid; gap:24px }
.hero-copy h1{ font-size:var(--step-4); color:var(--on-dark) }
.hero-copy h1 .hl{ display:block }
.hero-copy .lede{ font-size:1.06rem; line-height:1.55; color:rgba(251,241,226,.9); max-width:44ch }
.hero-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:16px 28px }
.caps{ position:absolute; inset:0; z-index:2; pointer-events:none }
.cap{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); opacity:0; visibility:hidden }
.cap .inner{ max-width:620px; display:grid; gap:14px }
.cap .eyebrow{ color:var(--mustard) }
.cap h2{ font-size:var(--step-3); color:var(--on-dark) }
.cue{ position:absolute; z-index:3; left:var(--gutter-l); bottom:calc(64px + env(safe-area-inset-bottom, 0px)); display:flex; align-items:center; gap:12px; font-size:.82rem; font-weight:600; color:rgba(251,241,226,.85) }
.cue .track{ width:130px; height:3px; border-radius:3px; background:rgba(255,255,255,.25); overflow:hidden }
.cue .track i{ display:block; height:100%; background:var(--mustard); transform-origin:0 50%; transform:scaleX(0) }
.scrub-track{ height:400vh }
.motion .stage{ position:sticky; top:0 }
html:not(.motion) .stage{ height:min(92vh, 860px) }
html:not(.motion) .scrub-track, html:not(.motion) .caps, html:not(.motion) .cue{ display:none }
@media (max-width:700px){
  .shade{ background:linear-gradient(180deg, rgba(44,25,17,.88) 0%, rgba(58,32,22,.55) 36%, rgba(58,32,22,0) 52%, rgba(44,25,17,.55) 64%, rgba(44,25,17,.94) 82%, rgba(44,25,17,.96) 100%) }
  .hero-copy .lede{ font-size:.98rem }
  .hero-copy{ top:calc(96px + env(safe-area-inset-top, 0px)); bottom:calc(36px + env(safe-area-inset-bottom, 0px)); transform:none }
  .hero-copy .inner{ height:100%; align-content:space-between }
  .hero-top, .hero-foot{ display:grid; gap:16px }
  .cap{ top:calc(110px + env(safe-area-inset-top, 0px)); transform:none }
  .cue{ display:none }
}
@media (min-width:701px){ .hero-top, .hero-foot{ display:grid; gap:24px } }

/* The cup that leaves the video */
#cupfx{ position:fixed; left:0; top:0; z-index:12; pointer-events:none; will-change:transform; visibility:hidden }
#cupfx img, #cupfx canvas{ position:absolute; inset:0; width:100%; height:100% }
#cupfx canvas{ opacity:0 }

/* ---------- Torn paper seams ---------- */
.torn{ position:relative; z-index:4 }
.torn::before{ content:""; position:absolute; left:0; right:0; top:-40px; height:44px; background:var(--tear-color, var(--cream));
  -webkit-mask:var(--tear-a) 0 0/100% 100% no-repeat; mask:var(--tear-a) 0 0/100% 100% no-repeat; pointer-events:none }
.torn-bottom::after{ content:""; position:absolute; left:0; right:0; bottom:-40px; height:44px; background:var(--tear-bottom, var(--cream)); transform:scaleY(-1);
  -webkit-mask:var(--tear-b) 0 0/100% 100% no-repeat; mask:var(--tear-b) 0 0/100% 100% no-repeat; pointer-events:none; z-index:2 }

/* ---------- Sections ---------- */
section{ position:relative }
.band{ padding-block:clamp(84px, 10vw, 150px) }
.head{ display:grid; gap:16px; margin-bottom:clamp(36px, 5vw, 60px) }
.head h2{ font-size:var(--step-3) }
.head p{ max-width:54ch; color:var(--ink-2) }
.head.center{ justify-items:center; text-align:center }
.head.center .eyebrow::before{ content:""; width:56px; height:1.5px; background:currentColor; opacity:.7 }

/* ---------- 02 The ritual + the 3D cup ---------- */
.ritual{ background:var(--cream); --tear-color:var(--cream); padding-block:clamp(90px, 10vw, 150px) clamp(60px, 7vw, 100px) }
.ritual-grid{ display:grid; grid-template-columns:minmax(0, 1.3fr) minmax(0, .7fr); gap:clamp(32px, 5vw, 72px); align-items:center }
@media (max-width:900px){ .ritual-grid{ grid-template-columns:minmax(0,1fr) } .slot-wrap{ order:-1 } }
.ritual-copy{ position:relative; display:grid; gap:34px }
.statement{ position:relative; font:800 clamp(2.2rem, 1.3rem + 3.3vw, 4.5rem)/.98 var(--display); text-transform:uppercase; letter-spacing:.005em; color:var(--ink); text-wrap:pretty }
.pill{ display:inline-block; width:1.9em; height:.84em; border-radius:999px; vertical-align:.02em; background:var(--tile) center/cover no-repeat; margin-inline:.08em; box-shadow:inset 0 0 0 3px rgba(255,255,255,.4) }
.pill.summit{ background-image:url("media/pill-summit.webp") }
.pill.pour{ background-image:url("media/pill-pour.webp") }
.pill.beans{ background-image:url("media/pill-beans.webp") }
.ritual-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:16px 28px }
.link{ font-weight:700; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:6px; text-decoration-color:var(--mustard) }
.link:hover{ color:var(--choc) }
.slot-wrap{ position:relative; display:grid; justify-items:center; gap:18px }
.slot-wrap::before{ content:""; position:absolute; width:min(118%, 470px); aspect-ratio:1; border-radius:50%; top:50%; left:50%; transform:translate(-50%, -54%);
  background:radial-gradient(circle, var(--mustard) 0 62%, rgba(245,179,1,0) 62.5%), radial-gradient(circle, rgba(245,179,1,.18) 0 72%, rgba(245,179,1,0) 72.5%) }
.slot{ position:relative; width:min(100%, 360px); aspect-ratio:406 / 517; touch-action:pan-y; cursor:grab; background:none; border:0; padding:0; border-radius:24px }
.slot.grabbing{ cursor:grabbing }
.slot img{ width:100%; height:100%; object-fit:contain }
.slot .shadow{ position:absolute; left:8%; right:8%; bottom:-3%; height:7%; border-radius:50%; background:radial-gradient(closest-side, rgba(59,34,23,.35), rgba(59,34,23,0)); z-index:-1 }
.has3d .slot img{ visibility:hidden }
.spin-hint{ position:relative; font-size:.82rem; font-weight:600; color:var(--ink-2); display:inline-flex; align-items:center; gap:8px }
.spin-hint svg{ width:18px; height:18px }
html:not(.has3d) .spin-hint{ display:none }
@media (max-width:900px){ .slot{ width:min(62vw, 300px) } }

/* ---------- 03 Menu: tiles + cards ---------- */
.menu{ background:var(--cream); padding-top:clamp(40px, 5vw, 70px) }
.tiles{ display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:16px; margin-bottom:40px }
@media (max-width:980px){ .tiles{ grid-template-columns:repeat(3, minmax(0, 1fr)) } }
.tile{ display:grid; justify-items:center; gap:14px; background:none; border:0; padding:0; cursor:pointer; color:var(--ink) }
.tile .pic{ width:100%; aspect-ratio:1; border-radius:26px; background:var(--tile); display:grid; place-items:center; transition:transform .25s ease, background .2s ease, box-shadow .2s ease }
.tile .pic img{ width:80%; height:80%; object-fit:contain; transition:transform .25s ease }
.tile:hover .pic img{ transform:rotate(-4deg) scale(1.04) }
.tile b{ font:800 1.15rem/1 var(--display); text-transform:uppercase; letter-spacing:.02em }
.tile:hover .pic{ transform:translateY(-5px); background:#EEDFCB }
.tile[aria-pressed="true"] .pic{ background:var(--mustard); box-shadow:0 10px 24px rgba(245,179,1,.35) }
.menu-bar{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; font-weight:600; color:var(--ink-2) }
.menu-bar button{ background:none; border:0; padding:6px 0; font-weight:700; color:var(--ink); text-decoration:underline; text-underline-offset:5px; cursor:pointer }
.items{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap:16px }
.item{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 16px; align-items:start; background:var(--white); border-radius:22px; padding:22px 22px 20px; box-shadow:0 1px 0 var(--line) }
.item h3{ font-size:1.7rem; line-height:.95 }
.item .desc{ grid-column:1 / -1; color:var(--ink-2); font-size:.96rem }
.item .row{ grid-column:1 / -1; display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:6px }
.item .price{ font:800 1.5rem/1 var(--display); font-variant-numeric:tabular-nums }
.add{ width:44px; height:44px; border-radius:50%; border:0; background:var(--choc); color:var(--on-dark); font-size:1.5rem; line-height:1; cursor:pointer; display:grid; place-items:center; transition:background .2s ease, transform .15s ease }
.add:hover{ background:var(--mustard); color:var(--ink) }
.add:active{ transform:scale(.92) }
.tag{ justify-self:start; align-self:center; font:700 .7rem/1 var(--body); letter-spacing:.06em; text-transform:uppercase; background:var(--mustard); color:var(--ink); border-radius:999px; padding:6px 10px }
.tag.alt{ background:var(--tile); color:var(--choc) }

/* ---------- 04 Promise band: the bean loop is the background ---------- */
.promise{ --bean-bg:#FDB806; background:var(--bean-bg); color:var(--ink); --tear-color:var(--bean-bg); --tear-bottom:var(--bean-bg); padding-block:clamp(80px, 9vw, 130px); overflow-x:clip }
.bean-video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 47.8%; pointer-events:none; z-index:0;
  -webkit-mask:linear-gradient(180deg, transparent 0, #000 9%, #000 91%, transparent 100%); mask:linear-gradient(180deg, transparent 0, #000 9%, #000 91%, transparent 100%) }
.promise-grid{ position:relative; z-index:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(0, 1.1fr) minmax(0,1fr); gap:clamp(20px, 4vw, 56px); align-items:center }
.promise-col{ display:grid; gap:clamp(48px, 8vw, 140px) }
.promise-col.right{ text-align:right }
.promise h3{ font-size:clamp(1.7rem, 1.3rem + 1.2vw, 2.4rem) }
.promise p{ margin-top:10px; font-size:.98rem; color:#4E3322; max-width:34ch }
.promise-col.right p{ margin-left:auto }
.promise-art{ aspect-ratio:1; max-width:520px; width:100%; justify-self:center }   /* empty: the bean shows through here */
@media (max-width:860px){
  .promise-grid{ grid-template-columns:minmax(0,1fr) }
  .promise-col{ gap:36px }
  .promise-col.right{ text-align:left } .promise-col.right p{ margin-left:0 }
  .promise-art{ position:relative; z-index:-1; max-width:340px; margin-block:8px }
  .promise .bean-video{ inset:auto; left:50%; top:50%; width:245%; height:auto; aspect-ratio:16 / 9; transform:translate(-50%, -50%);
    -webkit-mask:radial-gradient(closest-side, #000 72%, transparent 100%); mask:radial-gradient(closest-side, #000 72%, transparent 100%) }
}

/* ---------- 05 Seasonal beans ---------- */
.coffee{ background:var(--white); --tear-color:var(--white) }
.bags{ display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap:20px }
.bag{ display:grid; grid-template-rows:auto 1fr; background:var(--cream); border-radius:26px; overflow:hidden }
.bag-top{ position:relative; aspect-ratio:5 / 4; background:var(--c); color:var(--on-dark); padding:22px 24px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden }
.bag-top::before{ content:""; position:absolute; right:-20%; bottom:-25%; width:78%; aspect-ratio:1; background:url(media/sketch-coffee-bean-white.webp) center / contain no-repeat; opacity:.16; transform:rotate(-8deg); pointer-events:none }
.bag-top::after{ content:""; position:absolute; right:-22%; bottom:-34%; width:80%; aspect-ratio:1; border-radius:50%; background:rgba(255,255,255,.08); box-shadow:0 0 0 26px rgba(255,255,255,.05) }
.bag-top .origin{ font-weight:700; font-size:.86rem; letter-spacing:.08em; text-transform:uppercase; position:relative; z-index:1 }
.bag-top h3{ font-size:clamp(2.4rem, 2rem + 1.4vw, 3.2rem); position:relative; z-index:1 }
.bag-top .alt{ font-weight:600; font-size:.92rem; position:relative; z-index:1; color:rgba(251,241,226,.85) }
.bag-top img{ position:absolute; right:18px; top:16px; width:84px; opacity:.9; z-index:1 }
.bag-body{ padding:22px 24px 24px; display:grid; gap:16px; align-content:start }
.notes{ font:800 1.35rem/1.05 var(--display); text-transform:uppercase; color:var(--choc) }
.specs{ margin:0; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px 16px }
.specs dt{ font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2) }
.specs dd{ margin:2px 0 0; font-weight:500 }
.bag-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:16px; border-top:1px solid var(--line) }
.bag-foot .price{ font:800 1.7rem/1 var(--display) }
.sub{ position:relative; margin-top:28px; display:grid; grid-template-columns:minmax(0,1.2fr) auto auto; gap:20px 28px; align-items:center; background:var(--choc); color:var(--on-dark); border-radius:26px; padding:30px }
.sub h3{ font-size:clamp(1.8rem, 1.4rem + 1vw, 2.4rem) }
.sub h3 .hl{ color:var(--mustard) }
.sub p{ color:var(--on-dark-2); margin-top:6px; font-size:.95rem }
.seg{ display:flex; gap:4px; padding:4px; border-radius:999px; background:rgba(255,255,255,.12) }
.seg label{ position:relative; cursor:pointer }
.seg input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer }
.seg span{ display:block; padding:10px 16px; border-radius:999px; font-weight:700; font-size:.88rem; white-space:nowrap }
.seg input:checked + span{ background:var(--mustard); color:var(--ink) }
.seg input:focus-visible + span{ outline:3px solid var(--white) }
.sub-price{ font:800 2rem/1 var(--display); white-space:nowrap }
.sub-price small{ font:500 .85rem/1 var(--body); color:var(--on-dark-2) }
